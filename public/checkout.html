<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Koloonline Store</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>🔥 Checkout</h1>
  </header>

  <main>
    <section class="checkout-form">
      <h2>Enter your details to place the order</h2>
      <form id="orderForm">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="John Doe" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="example@mail.com" required>

        <label for="address">Address</label>
        <input type="text" id="address" name="address" placeholder="123 Street, City, Country" required>

        <button type="submit">Place Order</button>
      </form>

      <p id="orderStatus" style="margin-top: 1rem; color: green;"></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Koloonline Store. All rights reserved.</p>
  </footer>

  <script src="js/main.js"></script>
  <script>
    // ربط الفورم بالـ API مباشرة
    const form = document.getElementById("orderForm");
    const status = document.getElementById("orderStatus");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const orderData = {
        title: "Sample Product", // يمكن تعديلها ديناميك حسب المنتج
        link: "#", // رابط المنتج
        price: 49.99, // سعر المنتج
        country: "US", // الدولة
        name: form.name.value,
        email: form.email.value,
        address: form.address.value
      };

      try {
        const res = await fetch("/api/orders", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(orderData)
        });
        const data = await res.json();
        if(data.status === "success"){
          status.textContent = "✅ Order placed successfully!";
          form.reset();
        } else {
          status.style.color = "red";
          status.textContent = "❌ Failed to place order.";
        }
      } catch (err) {
        status.style.color = "red";
        status.textContent = "❌ Error sending order.";
      }
    });
  </script>
</body>
</html>
