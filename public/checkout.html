<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Checkout | Koloonline Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header style="background:#232f3e; padding:15px; text-align:center;">
<img src="https://i.postimg.cc/9fVfC1Y4/1000276862.png" style="height:70px;">
</header>

<h2 style="text-align:center;margin:20px">🛒 Checkout</h2>
<div id="cartItems" class="products"></div>
<h3 id="totalPrice" style="text-align:center;"></h3>
<button class="buy-btn" onclick="confirmOrder()">Confirm Order</button>

<script>
let cart=JSON.parse(localStorage.getItem("cart"))||[];

function displayCart(){
let html="";
cart.forEach(p=>{html+=`<div class="card"><img src="${p.image}"><div class="card-content"><h3>${p.title}</h3><p>$${p.price}</p></div></div>`;});
document.getElementById("cartItems").innerHTML=html;
let total=cart.reduce((a,b)=>a+b.price,0);
document.getElementById("totalPrice").innerText="Total: $"+total.toFixed(2);
}

function confirmOrder(){
if(cart.length===0){alert("Cart is empty"); return;}
localStorage.removeItem("cart");
window.location.href="thankyou.html";
}

displayCart();
</script>

</body>
</html>
