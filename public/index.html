<style>
body{margin:0;font-family:Arial;background:#f5f5f5;}
header{background:#232f3e;color:#fff;padding:15px;text-align:center;}
header img{height:70px;}
.navbar{display:flex;justify-content:space-between;padding:10px;background:#37475a;flex-wrap:wrap;}
.navbar input{width:45%;padding:8px;border:none;border-radius:4px;}
.navbar button{background:#ff9900;border:none;padding:8px;border-radius:4px;font-weight:bold;cursor:pointer;margin:3px;}
#suggestions{position:absolute;top:45px;left:10px;background:#fff;width:45%;z-index:999;border-radius:6px;box-shadow:0 4px 10px rgba(0,0,0,0.2);}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;padding:20px;}
.card{background:#fff;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,0.1);overflow:hidden;}
.card img{width:100%;height:200px;object-fit:contain;}
.card-content{text-align:center;padding:10px;}
.card-content p{color:#b12704;font-weight:bold;}
.buy-btn{background:#ff9900;border:none;width:90%;margin:5px auto;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;font-weight:bold;cursor:pointer;border-radius:6px;}
.buy-btn img{height:18px;}
footer{background:#232f3e;color:#fff;text-align:center;padding:20px;margin-top:20px;}
</style>

</head>
<body>

<header>
  <img src="https://i.postimg.cc/9fVfC1Y4/1000276862.png" alt="Koloonline Logo">
</header>

<div class="navbar">
  <input type="text" id="searchInput" placeholder="Search products..." oninput="smartSuggest()">
  <div id="suggestions"></div>
  <button>Cart 🛒 (<span id="cartCount">0</span>)</button>
</div>

<div class="products" id="products"></div>

<footer>
<img src="https://i.postimg.cc/9fVfC1Y4/1000276862.png" style="height:30px"><br>
<p>© 2026 Koloonline</p>
</footer>

<script>
// fallback products
let products=[
  {id:1,title:"Smart Watch Pro",asin:"B09V7Z4TJG",price:39.99,category:"wearables",image:"https://m.media-amazon.com/images/I/61IMRs+o0iL._AC_SL1500_.jpg"},
  {id:2,title:"Wireless Earbuds",asin:"B08T5GJ2M7",price:29.99,category:"electronics",image:"https://m.media-amazon.com/images/I/71v9z1k4a7L._AC_SL1500_.jpg"},
  {id:3,title:"Air Fryer 5L",asin:"B08CVL1SV6",price:59.99,category:"kitchen",image:"https://m.media-amazon.com/images/I/81v8b8h50EL._AC_SL1500_.jpg"},
  {id:4,title:"Home LED Lamp",asin:"B08XYT4JX7",price:19.99,category:"home",image:"https://m.media-amazon.com/images/I/61HqX8pU7FL._AC_SL1500_.jpg"}
];

function buildLink(asin,country){
  const tags = {
    US:"koloonlinesto-20",
    CA:"linasobhy20d8-20",
    EG:"onlinesh03f31-21",
    PL:"koloonline-21"
  };
  const tag = tags[country||"US"];
  return `https://www.amazon.com/dp/${asin}?tag=${tag}`;
}

function displayProducts(list){
  let html="";
  list.forEach((p,i)=>{
    html+=`<div class="card">
      <img src="${p.image}">
      <div class="card-content"><h3>${p.title}</h3><p>$${p.price}</p></div>
      <button class="buy-btn" onclick='cartAdd(${JSON.stringify(p)})'>
      <img src="https://i.postimg.cc/9fVfC1Y4/1000276862.png"> Add to Cart</button>
      <button class="buy-btn" onclick='window.open("${buildLink(p.asin)}","_blank")'>
      🔥 Buy Now</button>
    </div>`;
  });
  document.getElementById("products").innerHTML=html;
}

function smartSuggest(){
  let q=document.getElementById("searchInput").value.toLowerCase();
  let results=products.filter(p=>p.title.toLowerCase().includes(q));
  displayProducts(results);
  let sug="";
  results.slice(0,5).forEach(p=>{
    sug+=`<div onclick="selectProduct('${p.title}')" style="padding:8px;cursor:pointer">${p.title}</div>`;
  });
  document.getElementById("suggestions").innerHTML=sug;
}

function selectProduct(t){
  document.getElementById("searchInput").value=t;
  document.getElementById("suggestions").innerHTML="";
  smartSuggest();
}

// Cart
let cart=JSON.parse(localStorage.getItem("cart")||"[]");
function cartAdd(p){cart.push(p);localStorage.setItem("cart",JSON.stringify(cart));updateCart();}
function updateCart(){document.getElementById("cartCount").innerText=cart.length;}
updateCart();

displayProducts(products);
</script>

</body>
</html>
