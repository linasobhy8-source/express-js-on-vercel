<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Koloonline Store | Best Amazon Deals 2026</title>
<meta name="description" content="Discover the best Amazon deals in 2026. Smart watches, gadgets, electronics, and more.">
<meta name="keywords" content="Amazon, smart watch, gadgets, electronics, deals, affiliate">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Open Graph & Twitter -->
<meta property="og:title" content="Koloonline Store | Best Amazon Deals 2026">
<meta property="og:description" content="Discover top Amazon products with exclusive affiliate links.">
<meta property="og:image" content="https://i.postimg.cc/9fVfC1Y4/1000276862.png">
<meta property="og:site_name" content="Koloonline Store">
<meta property="og:url" content="https://www.koloonline.online">
<meta name="twitter:card" content="summary_large_image">
<meta property="twitter:title" content="Koloonline Store | Best Amazon Deals 2026">
<meta property="twitter:description" content="Discover top Amazon products with exclusive affiliate links.">
<meta property="twitter:image" content="https://i.postimg.cc/9fVfC1Y4/1000276862.png">

<!-- GTM -->
<script async src="https://www.googletagmanager.com/gtm.js?id=GTM-KNQM8KBN"></script>

<!-- AdSense -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1294940976431468"
crossorigin="anonymous"></script>

<style>
body{margin:0;font-family:Arial;background:#f5f5f5;}
header{background:#232f3e;padding:15px;text-align:center;}
header img{height:70px;}
.navbar{display:flex;justify-content:center;gap:10px;padding:10px;background:#37475a;flex-wrap:wrap;}
.navbar input{width:50%;padding:8px;border-radius:4px;border:none;}
.navbar button{background:#ff9900;border:none;padding:8px;border-radius:4px;color:#fff;font-weight:bold;cursor:pointer;}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;padding:20px;}
.card{background:#fff;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,0.1);overflow:hidden;text-align:center;padding:10px;}
.card img{width:100%;height:200px;object-fit:contain;}
.buy-btn{background:#ff9900;border:none;width:90%;margin:5px auto;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;font-weight:bold;cursor:pointer;border-radius:6px;color:#fff;}
.buy-btn img{height:20px;}
footer{background:#232f3e;color:#fff;text-align:center;padding:20px;margin-top:20px;}
</style>

</head>
<body>

<header>
<img src="https://i.postimg.cc/9fVfC1Y4/1000276862.png" alt="Koloonline Logo">
</header>

<div class="navbar">
<input type="text" id="searchInput" placeholder="Search Amazon Products..." oninput="searchAmazon()">
<button onclick="goToCart()">Cart 🛒 (<span id="cartCount">0</span>)</button>
</div>

<div class="products" id="products"></div>

<footer>
<img src="https://i.postimg.cc/9fVfC1Y4/1000276862.png" style="height:30px"><br>
<p>© 2026 Koloonline</p>
</footer>

<script>
// 🛒 CART
let cart = JSON.parse(localStorage.getItem("cart")||"[]");
function updateCart(){document.getElementById("cartCount").innerText = cart.length;}
updateCart();
function addToCart(p){cart.push(p);localStorage.setItem("cart",JSON.stringify(cart));updateCart();}

// 🔍 DYNAMIC AMAZON SEARCH
let productsList=[];
async function loadProducts(country="US"){
  try{
    const res = await fetch(`/api/products?country=${country}`);
    const data = await res.json();
    productsList = data.products;
    displayProducts(productsList);
  }catch(e){console.error(e);}
}
loadProducts();

// 🖥 DISPLAY
function displayProducts(list){
  const container = document.getElementById("products");
  container.innerHTML="";
  list.forEach(p=>{
    const card = document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <img src="${p.image}" alt="${p.title}">
      <h3>${p.title}</h3>
      <p>$${p.price}</p>
      <button class="buy-btn" onclick='addToCart(${JSON.stringify(p)})'>
        <img src="https://i.postimg.cc/9fVfC1Y4/1000276862.png"> Add to Cart
      </button>
      <button class="buy-btn" onclick="window.open('${p.affiliate_link}','_blank')">
        🔥 Buy Now
      </button>
    `;
    container.appendChild(card);
  });
}

// 🔍 SEARCH
function searchAmazon(){
  const q = document.getElementById("searchInput").value.toLowerCase();
  displayProducts(productsList.filter(p=>p.title.toLowerCase().includes(q)));
}

// 🛒 GO TO CART
function goToCart(){alert("Cart contains "+cart.length+" items.");}
</script>

</body>
</html>
