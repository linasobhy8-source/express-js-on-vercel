<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🎉 Thank You | Koloonline Store</title>
<link rel="stylesheet" href="css/style.css">
<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 50px;
  background: #f5f5f5;
  color: #232f3e;
}
header {
  font-size: 28px;
  margin-bottom: 20px;
  font-weight: bold;
}
p {
  font-size: 18px;
  margin-bottom: 30px;
}
button {
  padding: 12px 20px;
  font-size: 16px;
  background: #ff9900;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: 0.3s;
}
button:hover {
  background: #e68a00;
}
</style>
</head>
<body>
<header>🎉 Thank You for Your Order!</header>
<p>Your order has been successfully received. You will be redirected to the homepage shortly.</p>
<button onclick="window.location.href='index.html'">Go to Homepage</button>

<script>
// Redirect after 5 seconds
setTimeout(() => {
  window.location.href = "index.html";
}, 5000);
</script>
</body>
</html>
